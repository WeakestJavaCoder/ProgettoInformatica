<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <meta charset="UTF-8">
  <title>Esercizi Svolti - Infinity School</title>
  <style>
    /* Riga del livello: freccia a sinistra e titolo centrato */
    .level-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1.2em auto;
      max-width: 900px;
      padding: 0 16px;
      min-height: 40px;
    }
    #back-btn {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #2a4d69;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      transition: color 0.2s, transform 0.2s, background 0.2s;
    }
    #back-btn:hover {
      color: #1e3a5f;
      background: #eef2ff;
      transform: translateY(-50%) translateY(-1px);
    }
    #level-title {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      color: #2a4d69;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="header-row">
      <div class="header-left">
        <button id="hamburger" class="header-btn">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
      <div class="header-center">
        <h1 class="main-title">Infinity School</h1>
      </div>
      <div class="header-right">
        <button id="trophy" class="header-btn" title="Esercizi">
          <i class="fa-solid fa-trophy"></i>
        </button>
        <button id="user" class="header-btn" title="Profilo">
          <i class="fa-solid fa-user-circle"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="level-header">
    <button id="back-btn" title="Torna alla Home" aria-label="Torna alla Home">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h2 id="level-title">Esercizi Svolti</h2>
  </div>

  <main>
    <section class="esercizi-section" id="esercizi-list">
      </section>
  </main>

  <script src="script.js"></script>
  <script>
    // Aspetta che il contenuto del DOM sia completamente caricato
    document.addEventListener('DOMContentLoaded', () => {
      const pulsanteIndietro = document.getElementById('back-btn');
      if (pulsanteIndietro) {
        pulsanteIndietro.addEventListener('click', () => {
          // Reindirizza l'utente alla pagina principale (Home)
          window.location.href = 'index.html';
        });
      }
    });
  </script>
</body>
</html>
