<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Lingua dell'interfaccia - Infinity School</title>

  <!-- Foglio di stile comune -->
  <link rel="stylesheet" href="style.css">

  <!-- Font Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome per le icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* Riga del livello: freccia a sinistra e titolo centrato */
    .level-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1.2em auto;
      max-width: 900px;
      padding: 0 16px;
      min-height: 40px;
    }
    #back-btn {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #2a4d69;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      transition: color 0.2s, transform 0.2s, background 0.2s;
    }
    #back-btn:hover {
      color: #1e3a5f;
      background: #eef2ff;
      transform: translateY(-50%) translateY(-1px);
    }
    #level-title {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      color: #2a4d69;
      text-align: center;
    }

    /* Stile per le caselle lingua */
    .language-container {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-top: 120px; /* circa metà pagina */
    }
    .language-box {
      background: #ffffff;
      border: 2px solid #2563eb33;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(37,99,235,0.12);
      padding: 16px;
      text-align: center;
      width: 150px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .language-box:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 10px 24px rgba(37,99,235,0.18);
    }
    .language-box img {
      width: 120px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .language-box p {
      margin: 0;
      font-size: 1.1rem;
      font-weight: bold;
      color: #2a4d69;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="header-row">
      <div class="header-left">
        <button id="hamburger" class="header-btn">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
      <div class="header-center">
        <h1 class="main-title">Infinity School</h1>
      </div>
      <div class="header-right">
        <button id="trophy" class="header-btn" title="Esercizi">
          <i class="fa-solid fa-trophy"></i>
        </button>
        <button id="user" class="header-btn" title="Profilo">
          <i class="fa-solid fa-user-circle"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Freccia e titolo centrato -->
  <div class="level-header">
    <button id="back-btn" title="Torna alla Home" aria-label="Torna alla Home">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h2 id="level-title">Lingua dell’interfaccia</h2>
  </div>

  <main style="padding:32px;text-align:center;">
    <p>Qui puoi scegliere la lingua dell’interfaccia del sito.</p>

    <div class="language-container">
      <div class="language-box">
        <img src="https://flagcdn.com/w320/gb.png" alt="Bandiera Regno Unito">
        <p>English</p>
      </div>
      <div class="language-box">
        <img src="https://flagcdn.com/w320/fr.png" alt="Bandiera Francia">
        <p>français</p>
      </div>
      <div class="language-box">
        <img src="https://flagcdn.com/w320/es.png" alt="Bandiera Spagna">
        <p>España</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const backBtn = document.getElementById('back-btn');
      if (backBtn) {
        backBtn.addEventListener('click', function () {
          window.location.href = 'index.html';
        });
      }
    });
  </script>
</body>
</html>
