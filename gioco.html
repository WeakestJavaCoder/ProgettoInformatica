<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Gioco - Infinity School</title>
<style>
body { margin:0; font-family:sans-serif; background:#f7f7f7; }

.game-container { max-width:700px; margin:2em auto; background:#fff; border-radius:12px; padding:25px; box-shadow:0 2px 8px #0001; }
#question, #questionA2, #questionB2, #questionC2 { font-size:1.5rem; text-align:center; margin-bottom:20px; }
#answers, #answersA2, #answersB2, #answersC2 { display:flex; flex-direction:column; gap:12px; }
.answer { padding:14px; background:#63ace5; color:white; border:none; border-radius:10px; font-size:1.2rem; cursor:pointer; }
.answer:hover { background:#4b86b4; }

.score, #result, #resultA2, #resultB2, #resultC2 { text-align:center; margin-top:18px; font-size:1.3rem; }

.word-bank span {
    display: inline-block; background: #eef2ff; border: 1px solid #2563eb; border-radius: 6px; padding: 6px 10px; margin: 4px; cursor: grab;
}
.drop-zone { min-height: 40px; border: 2px dashed #ccc; margin: 8px 0; padding: 6px; border-radius: 6px; background: #fafafa; }
.check-btn, .reset-btn { margin-top: 8px; background: #2a4d69; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right:5px;}
.result.correct { color: green; }
.result.wrong { color: red; }
</style>
</head>
<body>

<header class="top-bar">
  <div class="header-row">
    <div class="header-left">
      <button id="hamburger" class="header-btn">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
    <div class="header-center">
      <h1 class="main-title">Infinity School</h1>
    </div>
    <div class="header-right">
      <button id="trophy" class="header-btn" title="Esercizi">
        <i class="fa-solid fa-trophy"></i>
      </button>
      <button id="user" class="header-btn" title="Profilo">
        <i class="fa-solid fa-user-circle"></i>
      </button>
    </div>
  </div>
</header>

<div class="game-container" id="dragGame" style="display:none;">
    <h3>Sistema correttamente le seguenti frasi:</h3>
    <div id="dragExercise"></div>
</div>

<div class="game-container" id="gameA2" style="display:none;">
    <h3>Scegli l’articolo corretto</h3>
    <p id="questionA2"></p>
    <div id="answersA2">
        <button class="answer">Il</button>
        <button class="answer">Lo</button>
        <button class="answer">La</button>
        <button class="answer">L’</button>
    </div>
    <p id="resultA2"></p>
    <p id="scoreA2" class="score"></p>
</div>

<div class="game-container" id="gameB2" style="display:none;">
    <h3>Trova il sinonimo corretto</h3>
    <p id="questionB2"></p>
    <div id="answersB2"></div>
    <p id="resultB2"></p>
    <p id="scoreB2" class="score"></p>
</div>

<div class="game-container" id="gameC2" style="display:none;">
    <h3>Individua l’errore</h3>
    <p id="questionC2"></p>
    <div id="answersC2"></div>
    <p id="resultC2"></p>
    <p id="scoreC2" class="score"></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const parametri = new URLSearchParams(window.location.search);
    const livello = parametri.get("livello");
    const gioco = parametri.get("gioco");
    
    document.getElementById("back-btn").addEventListener("click", () => {
        window.location.href = `livello.html?livello=${livello}`;
    });

    document.getElementById("pageTitle").textContent = `Livello ${livello} - Gioco ${gioco}`;

    /* ---------------------- A1 Gioco 1: 4 frasi ---------------- */
    if(livello==="A1" && gioco==="1"){
        const contenitore = document.getElementById("dragGame");
        contenitore.style.display="block";

        const esercizi = [
            { answer: "Io vado a scuola in autobus ogni mattina", words:["in","autobus","mattina","scuola","Io","vado","ogni","a"] },
            { answer: "Lei mangia la mela rossa", words:["mangia","Lei","rossa","mela","la"] },
            { answer: "Noi giochiamo a calcio nel parco", words:["parco","calcio","a","giochiamo","nel","Noi"] },
            { answer: "Voi leggete libri interessanti ogni giorno", words:["leggete","Voi","libri","giorno","ogni","interessanti"] }
        ];

        const esercizioTrascina = document.getElementById("dragExercise");
        esercizi.forEach((es, i)=>{
            const div = document.createElement("div");
            div.className="exercise";
            div.dataset.answer = es.answer;
            let html = `<p>Frase ${i+1}</p>
                        <div class="word-bank"></div>
                        <div class="drop-zone"></div>
                        <button class="check-btn">Verifica</button>
                        <button class="reset-btn">Ricomincia</button>
                        <p class="result"></p>`;
            div.innerHTML=html;
            esercizioTrascina.appendChild(div);

            const areaParole = div.querySelector('.word-bank');
            const zonaRilascio = div.querySelector('.drop-zone');
            const pulsanteVerifica = div.querySelector('.check-btn');
            const pulsanteReset = div.querySelector('.reset-btn');
            const risultato = div.querySelector('.result');

            function popolaAreaParole(){
                areaParole.innerHTML = "";
                es.words.forEach(parola=>{
                    const span = document.createElement('span');
                    span.textContent = parola;
                    span.setAttribute('draggable','true');
                    span.style.margin='4px';
                    areaParole.appendChild(span);
                });
                rendiTrascinabile();
            }

            function rendiTrascinabile(){
                const parole = areaParole.querySelectorAll('span');
                parole.forEach(parola=>{
                    parola.addEventListener('dragstart', e=> e.dataTransfer.setData('text/plain', parola.textContent));
                });
            }

            popolaAreaParole();

            zonaRilascio.addEventListener('dragover', e=>e.preventDefault());
            zonaRilascio.addEventListener('drop', e=>{
                e.preventDefault();
                const testo = e.dataTransfer.getData('text/plain');
                const originale = [...areaParole.querySelectorAll("span")]
                    .find(s => s.textContent === testo);

                if (originale) originale.remove();

                const span = document.createElement('span');
                span.textContent = testo;
                span.style.margin = '4px';
                zonaRilascio.appendChild(span);
            });

            pulsanteVerifica.addEventListener('click', ()=>{
                const costruita = Array.from(zonaRilascio.querySelectorAll('span')).map(s=>s.textContent).join(' ');
                if(costruita.trim()===es.answer.trim()){
                    risultato.textContent="Corretto!";
                    risultato.className="result correct";
                } else {
                    risultato.textContent="Sbagliato, riprova.";
                    risultato.className="result wrong";
                }
            });

            pulsanteReset.addEventListener('click', ()=>{
                zonaRilascio.innerHTML = "";
                risultato.textContent = "";
                popolaAreaParole();
            });
        });
    }

    /* ---------------------- A2 Gioco 1 ---------------- */
    if(livello==="A2" && gioco==="1"){
        const contenitore = document.getElementById("gameA2");
        contenitore.style.display="block";

        const domande = [
            { word: "___ cane", correct: "Il" },
            { word: "___ amico", correct: "L’" },
            { word: "___ scuola", correct: "La" },
            { word: "___ zaino", correct: "Lo" }
        ];
        let indiceDomanda = 0, punteggio = 0;
        const domandaTesto = document.getElementById("questionA2");
        const risultatoTesto = document.getElementById("resultA2");
        const punteggioTesto = document.getElementById("scoreA2");
        const pulsantiA2 = document.querySelectorAll("#answersA2 .answer");

        function disabilitaPulsantiA2(stato){
            pulsantiA2.forEach(btn => btn.disabled = stato);
        }

        function caricaDomandaA2(){ 
            domandaTesto.textContent = domande[indiceDomanda].word;
            risultatoTesto.textContent=""; 
            punteggioTesto.textContent=`Corrette: ${punteggio}/${domande.length}`;
            disabilitaPulsantiA2(false);
        }

        pulsantiA2.forEach(btn => btn.onclick = () => {
            disabilitaPulsantiA2(true);

            if(btn.textContent===domande[indiceDomanda].correct){
                punteggio++; risultatoTesto.textContent="✔️ Corretto!"; risultatoTesto.style.color="green";
            } else {
                risultatoTesto.textContent="❌ Sbagliato!"; risultatoTesto.style.color="red";
            }

            punteggioTesto.textContent=`Corrette: ${punteggio}/${domande.length}`;

            setTimeout(()=>{
                indiceDomanda++; 
                if(indiceDomanda<domande.length){
                    caricaDomandaA2();
                } else {
                    domandaTesto.textContent=`🎉 Hai finito! Punteggio: ${punteggio}/${domande.length}`;
                    document.getElementById("answersA2").style.display="none";
                    risultatoTesto.textContent=""; punteggioTesto.textContent="";
                }
            },800);
        });

        caricaDomandaA2();
    }

    /* ---------------------- B2 Gioco 1 ---------------- */
    if(livello==="B2" && gioco==="1"){
        const contenitore = document.getElementById("gameB2");
        contenitore.style.display="block";

        const domandeB2 = [
            { word: "Felice", options: ["Contento","Lento","Pesante","Bello","Ricco"], correct:"Contento"},
            { word: "Rapido", options:["Veloce","Povero","Stanco","Pesante","Fluido"], correct:"Veloce"},
            { word: "Pulito", options:["Sporco","Ordinato","Rumoroso","SottoSopra","Umido"], correct:"Ordinato"}
        ];
        let indiceB2=0, punteggioB2=0;
        const testoDomandaB2=document.getElementById("questionB2");
        const areaRisposteB2=document.getElementById("answersB2");
        const testoRisultatoB2=document.getElementById("resultB2");
        const testoPunteggioB2=document.getElementById("scoreB2");

        function disabilitaPulsantiB2(stato){
            [...areaRisposteB2.querySelectorAll(".answer")].forEach(btn => btn.disabled = stato);
        }

        function caricaDomandaB2(){
            testoDomandaB2.textContent=`Scegli il sinonimo corretto di: ${domandeB2[indiceB2].word}`;
            areaRisposteB2.innerHTML="";
            testoPunteggioB2.textContent=`Corrette: ${punteggioB2}/${domandeB2.length}`;
            domandeB2[indiceB2].options.forEach(opzione=>{
                const btn=document.createElement("button");
                btn.className="answer";
                btn.textContent=opzione;
                btn.onclick=()=>controllaRispostaB2(opzione);
                areaRisposteB2.appendChild(btn);
            });
        }

        function controllaRispostaB2(valore){
            disabilitaPulsantiB2(true);

            if(valore===domandeB2[indiceB2].correct){
                punteggioB2++; testoRisultatoB2.textContent="✔️ Corretto!"; testoRisultatoB2.style.color="green";
            } else {
                testoRisultatoB2.textContent="❌ Sbagliato!"; testoRisultatoB2.style.color="red";
            }

            testoPunteggioB2.textContent=`Corrette: ${punteggioB2}/${domandeB2.length}`;

            setTimeout(()=>{
                indiceB2++;
                if(indiceB2<domandeB2.length){
                    caricaDomandaB2();
                } else {
                    testoDomandaB2.textContent=`🎉 Hai completato il gioco! Punteggio: ${punteggioB2}/${domandeB2.length}`;
                    areaRisposteB2.innerHTML=""; testoRisultatoB2.textContent=""; testoPunteggioB2.textContent="";
                }
            },900);
        }

        caricaDomandaB2();
    }

    /* ---------------------- C2 Gioco 1 ---------------- */
    if(livello==="C2" && gioco==="1"){
        const contenitore = document.getElementById("gameC2");
        contenitore.style.display="block";

        const domandeC2 = [
            { phrase:"Se lo avrei saputo, non sarei venuto.", error:"avessi"},
            { phrase:"La riunione, che era previsto per ieri, è stata spostata.", error:"prevista"},
            { phrase:"Lui è uno dei più talentuosi artista del suo corso.", error:"artisti"}
        ];
        let indiceC2=0, punteggioC2=0;
        const testoDomandaC2=document.getElementById("questionC2");
        const areaRisposteC2=document.getElementById("answersC2");
        const testoRisultatoC2=document.getElementById("resultC2");
        const testoPunteggioC2=document.getElementById("scoreC2");

        function disabilitaPulsantiC2(stato){
            [...areaRisposteC2.querySelectorAll(".answer")].forEach(btn => btn.disabled = stato);
        }

        function caricaDomandaC2(){
            testoDomandaC2.textContent=`Individua la forma corretta nella frase:\n"${domandeC2[indiceC2].phrase}"`;
            areaRisposteC2.innerHTML=`<button class="answer">${domandeC2[indiceC2].error}</button><button class="answer">nessun errore</button>`;
            testoPunteggioC2.textContent=`Corrette: ${punteggioC2}/${domandeC2.length}`;
            [...areaRisposteC2.children].forEach(btn => btn.onclick=()=>controllaRispostaC2(btn.textContent));
        }

        function controllaRispostaC2(valore){
            disabilitaPulsantiC2(true);

            if(valore===domandeC2[indiceC2].error){ 
                punteggioC2++; testoRisultatoC2.textContent="✔️ Corretto!"; testoRisultatoC2.style.color="green";
            } else {
                testoRisultatoC2.textContent="❌ Sbagliato!"; testoRisultatoC2.style.color="red";
            }

            testoPunteggioC2.textContent=`Corrette: ${punteggioC2}/${domandeC2.length}`;

            setTimeout(()=>{
                indiceC2++;
                if(indiceC2<domandeC2.length){
                    caricaDomandaC2();
                } else {
                    testoDomandaC2.textContent=`🎉 Ottimo lavoro! Hai concluso il livello avanzato. Punteggio: ${punteggioC2}/${domandeC2.length}`;
                    areaRisposteC2.innerHTML=""; testoRisultatoC2.textContent=""; testoPunteggioC2.textContent="";
                }
            },900);
        }

        caricaDomandaC2();
    }
});
</script>
</body>
</html>
