<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Accademia di Italiano</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Stili specifici per la home */
    .desc-center {
      text-align: center;
      max-width: 600px;
      margin: 20px auto;
      display: block;
      font-size: 1.15rem;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="header-row">
      <div class="header-left">
        <button id="hamburger" class="header-btn"><i class="fa-solid fa-bars"></i></button>
      </div>
      <div class="header-center">
        <h1 class="main-title">ACCADEMIA DI ITALIANO</h1>
      </div>
      <div class="header-right">
        <button id="trophy" class="header-btn" title="Esercizi"><i class="fa-solid fa-trophy"></i></button>
        <button id="user" class="header-btn" title="Profilo"><i class="fa-solid fa-user-circle"></i></button>
      </div>
    </div>
  </header>

  <main>
    <section class="description">
      <p class="desc-center">Benvenuto! Seleziona una materia per iniziare.</p>
    </section>

    <section class="levels">
      <div class="levels-grid">
        <div class="level-row">
          <a class="level-box" href="livello.html?livello=A1" title="Geografia">
            <i class="fa-solid fa-earth-americas"></i>
            <span class="subject-name">Geografia</span>
          </a>
          <a class="level-box" href="livello.html?livello=A2" title="Matematica">
            <i class="fa-solid fa-calculator"></i>
            <span class="subject-name">Matematica</span>
          </a>
          <a class="level-box" href="livello.html?livello=biologia" title="Biologia">
            <i class="fa-solid fa-dna"></i>
            <span class="subject-name">Biologia</span>
          </a>
        </div>
        <div class="level-row">
          <a class="level-box" href="livello.html?livello=B2" title="Italiano">
            <i class="fa-solid fa-flag"></i>
            <span class="subject-name">Italiano</span>
          </a>
          <a class="level-box" href="livello.html?livello=C1" title="Storia">
            <i class="fa-solid fa-landmark"></i>
            <span class="subject-name">Storia</span>
          </a>
          <a class="level-box" href="livello.html?livello=C2" title="Tecnologia">
            <i class="fa-solid fa-desktop"></i>
            <span class="subject-name">Tecnologia</span>
          </a>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
