<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Infinity School</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .desc-center {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 18px auto;
      display: block;
      font-size: 1.15rem;
    }
    .title-common {
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-align: center;
      font-size: 1.6rem;
      margin: 0.5em 0 1em 0;
    }
    .levels-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
      margin-top: 24px;
      padding-bottom: 40px;
    }
    .level-row {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .level-box {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      border: 2px solid #2563eb33;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(37,99,235,0.08);
      transition: transform 0.12s, box-shadow 0.12s;
      display: flex;
      flex-direction: column; /* Icona sopra, testo sotto */
      align-items: center;
      justify-content: center;
      min-width: 140px;
      gap: 12px;
    }
    .level-box i {
      font-size: 2.5rem;
      color: #2563eb;
    }
    .subject-name {
      color: #2563eb;
      font-weight: bold;
      text-transform: uppercase; /* Stampatello */
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    .level-box:hover {
      background: #eef2ff;
      border-color: #2563eb;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 24px rgba(37,99,235,0.13);
    }
  </style>
</head>
<body>
  <!-- Liquid art background elements -->
  <div class="liquid-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <header class="top-bar">
    <div class="header-row">
      <div class="header-left">
        <button id="hamburger" class="header-btn">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
      <div class="header-center">
        <h1 class="main-title">Infinity School</h1>
      </div>
      <div class="header-right">
        <button id="trophy" class="header-btn" title="Esercizi">
          <i class="fa-solid fa-trophy"></i>
        </button>
        <button id="user" class="header-btn" title="Profilo">
          <i class="fa-solid fa-user-circle"></i>
        </button>
      </div>
    </div>
  </header>
  <main>
    <section class="description">
      <p class="desc-center">Benvenuto! Seleziona una materia per iniziare.</p>
    </section>
    <section class="levels">
      <div class="levels-grid">
        <div class="level-row">
          <a class="level-box" href="livello.html?livello=A1" title="Geografia">
            <i class="fa-solid fa-earth-americas"></i>
            <span class="subject-name">Geografia</span>
          </a>
          <a class="level-box" href="livello.html?livello=A2" title="Matematica">
            <i class="fa-solid fa-calculator"></i>
            <span class="subject-name">Matematica</span>
          </a>
          <a class="level-box" href="livello.html?livello=biologia" title="Biologia">
            <i class="fa-solid fa-dna"></i>
            <span class="subject-name">Biologia</span>
          </a>
        </div>
        <div class="level-row">
          <a class="level-box" href="livello.html?livello=B2" title="Italiano">
            <i class="fa-solid fa-flag"></i>
            <span class="subject-name">Italiano</span>
          </a>
          <a class="level-box" href="livello.html?livello=C1" title="Storia">
            <i class="fa-solid fa-landmark"></i>
            <span class="subject-name">Storia</span>
          </a>
          <a class="level-box" href="livello.html?livello=C2" title="Tecnologia">
            <i class="fa-solid fa-desktop"></i>
            <span class="subject-name">Tecnologia</span>
          </a>
        </div>
        <div class="level-row">
          <a class="level-box" href="livello.html?livello=inglese" title="Inglese">
            <i class="fa-solid fa-language"></i>
            <span class="subject-name">Inglese</span>
          </a>
          <a class="level-box" href="livello.html?livello=chimica" title="Chimica">
            <i class="fa-solid fa-flask-vial"></i>
            <span class="subject-name">Chimica</span>
          </a>
          <a class="level-box" href="livello.html?livello=fisica" title="Fisica">
            <i class="fa-solid fa-atom"></i>
            <span class="subject-name">Fisica</span>
          </a>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
